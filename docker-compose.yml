services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Build-time only -- see web.Dockerfile for why this cannot be a
        # runtime `environment:` entry. Supply the real value via a repo-root
        # .env file (gitignored) or an exported shell var named
        # NEXT_PUBLIC_MAPBOX_TOKEN before running `docker compose build`.
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      - api
